# GitHub Actions - Nix Flake Validation
# Runs on every push and pull request to catch configuration errors early.
name: Validate Nix Flake

on:
  # Run on all pushes to main branch
  push:
    branches: [main]
  # Run on all pull requests
  pull_request:
    branches: [main]
  # Allow manual triggering from GitHub UI
  workflow_dispatch:

jobs:
  # Job 1: Check flake syntax and evaluate both host configurations.
  validate:
    name: Evaluate hosts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # Parse every Nix file. This is fast and catches syntax errors without
      # needing any flake inputs.
      - name: Check Nix syntax
        run: |
          nix-instantiate --parse flake.nix > /dev/null
          find . -name '*.nix' -not -path './.git/*' -print0 \
            | xargs -0 -n1 nix-instantiate --parse > /dev/null
          echo "✓ Nix syntax is valid"

      # Pure-JS unit tests for the Quickshell helper library. These need no Nix
      # or Qt and run on the runner's preinstalled Node.
      - name: Run Quickshell JS unit tests
        run: node --test modules/features/desktop-env/quickshell/tests/*.test.js

      # The README embeds a Mermaid architecture diagram generated from the
      # modules/ tree; fail if it has drifted.
      - name: Check architecture diagram
        run: |
          ./assets/update_diagram.sh --check
          echo "✓ Architecture diagram is up to date"

      # nixfmt and deadnix are exposed as flake checks. Generated files such as
      # _hardware-generated.nix are excluded.
      - name: Check formatting and dead code
        run: |
          nix flake check
          echo "✓ Formatting and dead code checks pass"

      # Evaluate both host configurations. This is the gating check for the
      # workflow. The flake inputs default to public repositories, so the
      # runner needs no local checkout overrides.
      - name: Evaluate desktop and laptop
        run: |
          nix eval --raw ".#nixosConfigurations.desktop.config.system.build.toplevel.drvPath"
          nix eval --raw ".#nixosConfigurations.laptop.config.system.build.toplevel.drvPath"
          echo "✓ Both host configurations evaluate"

  # Job 2: Build the full system closures. This is advisory because building an
  # entire NixOS closure on free runners is slow and can time out for reasons
  # unrelated to the configuration; the evaluation above is the hard gate.
  build:
    name: Build hosts (advisory)
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Build desktop and laptop
        run: |
          nix build ".#nixosConfigurations.desktop.config.system.build.toplevel"
          nix build ".#nixosConfigurations.laptop.config.system.build.toplevel"
