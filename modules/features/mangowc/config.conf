# Window effects
blur = 0
blur_optimized = 1
blur_params_radius = 5
blur_params_num_passes = 2
border_radius = 8
focused_opacity = 1.0
unfocused_opacity = 1.0

# Gaps
gappih = 16
gappiv = 16
gappoh = 16
gappov = 16

# Animations
animations = 1
animation_duration_open = 400
animation_duration_close = 300

# Other appearance
borderpx = 2

# Mouse
mouse_natural_scrolling = 0

# Touchpad
trackpad_natural_scrolling = 1

# Autostart
exec-once = quickshell
exec-once = swaybg -i ~/Pictures/wallpapers/default.png -m fill
exec-once = sh -c "sleep 1; exec nm-applet --indicator"

source = ./colours.conf
source = ./binds.conf
