# yazi 25+ uses %s for the path. The old $@ form no longer expands, which made
# Neovim open the current directory.
[opener]
edit = [
  { run = "${EDITOR:-nvim} %s", block = true, desc = "Edit in $EDITOR" }
]
imv = [
  { run = "imv-dir %s", orphan = true, desc = "Open images with imv-dir" }
]

[open]
prepend_rules = [
  { mime = "image/*", use = "imv" },
  { mime = "text/*", use = "edit" },
  { mime = "application/{json,ndjson,javascript,yaml,toml,xml,x-shellscript}", use = "edit" },
  { mime = "inode/empty", use = "edit" }
]

# The section is [mgr], not [manager], in yazi 25+. Hidden entries stay out of
# the way until `.` is pressed.
[mgr]
ratio = [ 1, 4, 3 ]
linemode = "size"
show_hidden = false
show_symlink = true
sort_by = "natural"
sort_sensitive = false
sort_dir_first = true
scrolloff = 5

[preview]
wrap = "no"
tab_size = 2
max_width = 1000
max_height = 1200
image_filter = "lanczos3"
image_quality = 90
