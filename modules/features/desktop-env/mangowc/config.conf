# Window effects
border_radius = 8

# Gaps
gap_inner_horizontal = 10
gap_inner_vertical = 10
gap_outer_horizontal = 10
gap_outer_vertical = 10
special_gap_outer_horizontal = 48
special_gap_outer_vertical = 48
overview_gap_outer = 48

# Animations
animations = 1
animation_duration_open = 400
animation_duration_close = 300

# Other appearance
border_px = 2
dim_enable = 0

# Mouse
cursor_theme = Bibata-Modern-Ice
cursor_size = 24
mouse_natural_scrolling = 0
drag_corner = 4

# Touchpad
trackpad_natural_scrolling = 1
trackpad_disable_while_typing = 1
trackpad_click_method = 2

# Keyboard
repeat_rate = 35
repeat_delay = 200

# Layout
circle_layout = dwindle,tile,monocle,scroller,grid,deck
dwindle_horizontal_split = 1
tag_rule=id:1,layout_name:dwindle
tag_rule=id:2,layout_name:dwindle
tag_rule=id:3,layout_name:dwindle
tag_rule=id:4,layout_name:dwindle
tag_rule=id:5,layout_name:dwindle
tag_rule=id:6,layout_name:dwindle
tag_rule=id:7,layout_name:dwindle
tag_rule=id:8,layout_name:dwindle
tag_rule=id:9,layout_name:dwindle
tag_rule=id:0,layout_name:dwindle

# Windowrules
window_rule = tags:0,app_id:^(spotify)
window_rule = tags:0,app_id:vesktop
window_rule = is_term:1,app_id:^(foot|footclient|ghostty|com.mitchellh.ghostty|kitty)$
window_rule = no_swallow:1,app_id:^(mpv|imv)$
window_rule = app_id:mpv,is_floating:1,no_size_hint:0
# window_rule = is_floating:1,ignore_maximize:1,no_blur:1,width:600,height:600,title:foot

# window_rule = aspect_ratio:auto,app_id:.*

float_full_to_top = 1

# Environment Variables
env = QS_BAR,mangowc
env = QT_QPA_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24

# Autostart
exec_once = systemctl --user import-environment WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP && systemctl --user start wayland-session.target
exec_once = QS_BAR=mangowc quickshell
exec_once = swaybg -i ~/Pictures/wallpaper -m fill
exec_once = sh -c "sleep 1; exec nm-applet --indicator"

source = ./colours.conf
source = ./binds.conf
