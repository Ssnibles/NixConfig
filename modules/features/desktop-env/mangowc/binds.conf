# Application Launchers
bind = SUPER,Return,spawn,foot
bind = SUPER,Space,spawn,sh -c "vicinae toggle"
bind = SUPER,d,spawn,quickshell ipc call command-center toggle
bind = SUPER+Alt,L,spawn,quickshell ipc call lockscreen lock
bind = SUPER,e,spawn,foot -e yazi

# Window Management
bind = SUPER,q,killclient
bind = SUPER,f,togglefullscreen
bind = SUPER+Shift,f,togglefullscreen
bind = SUPER,v,togglefloating
bind = SUPER,c,togglefloating
bind = SUPER,o,toggleoverview
bind = SUPER,g,togglefloating
bind = SUPER+Shift,r,reload_config

# Vim & Arrow Style Window Resizing
bind = SUPER+Ctrl,h,resizewin,-50,+0
bind = SUPER+Ctrl,l,resizewin,+50,+0
bind = SUPER+Ctrl,k,resizewin,+0,-50
bind = SUPER+Ctrl,j,resizewin,+0,+50
bind = SUPER+Ctrl,Left,resizewin,-50,+0
bind = SUPER+Ctrl,Right,resizewin,+50,+0
bind = SUPER+Ctrl,Up,resizewin,+0,-50
bind = SUPER+Ctrl,Down,resizewin,+0,+50
bind = SUPER,equal,resizewin,+50,+50
bind = SUPER,minus,resizewin,-50,-50

# Directional Focus (Vim & Arrow keys)
bind = SUPER,h,focusdir,left
bind = SUPER,l,focusdir,right
bind = SUPER,k,focusdir,up
bind = SUPER,j,focusdir,down
bind = SUPER,Left,focusdir,left
bind = SUPER,Right,focusdir,right
bind = SUPER,Up,focusdir,up
bind = SUPER,Down,focusdir,down

# Move Windows (Vim & Arrow keys)
bind = SUPER+Shift,h,exchange_client,left
bind = SUPER+Shift,l,exchange_client,right
bind = SUPER+Shift,k,exchange_client,up
bind = SUPER+Shift,j,exchange_client,down
bind = SUPER+Shift,Left,exchange_client,left
bind = SUPER+Shift,Right,exchange_client,right
bind = SUPER+Shift,Up,exchange_client,up
bind = SUPER+Shift,Down,exchange_client,down

# Monitor Focus (Vim & Arrow keys)
bind = SUPER+Alt,h,focusmon,left
bind = SUPER+Alt,l,focusmon,right
bind = SUPER+Alt,k,focusmon,up
bind = SUPER+Alt,j,focusmon,down
bind = SUPER+Alt,Left,focusmon,left
bind = SUPER+Alt,Right,focusmon,right
bind = SUPER+Alt,Up,focusmon,up
bind = SUPER+Alt,Down,focusmon,down

# Move Window to Monitor (Vim & Arrow keys)
bind = SUPER+Shift+Ctrl,h,tagmon,left
bind = SUPER+Shift+Ctrl,l,tagmon,right
bind = SUPER+Shift+Ctrl,k,tagmon,up
bind = SUPER+Shift+Ctrl,j,tagmon,down
bind = SUPER+Shift+Ctrl,Left,tagmon,left
bind = SUPER+Shift+Ctrl,Right,tagmon,right
bind = SUPER+Shift+Ctrl,Up,tagmon,up
bind = SUPER+Shift+Ctrl,Down,tagmon,down

# Tags 1-9
bind = SUPER,1,view,1
bind = SUPER,2,view,2
bind = SUPER,3,view,3
bind = SUPER,4,view,4
bind = SUPER,5,view,5
bind = SUPER,6,view,6
bind = SUPER,7,view,7
bind = SUPER,8,view,8
bind = SUPER,9,view,9
bind = SUPER,0,view,10

# Move to Tag 1-9
bind = SUPER+Shift,1,tag,1,0
bind = SUPER+Shift,2,tag,2,0
bind = SUPER+Shift,3,tag,3,0
bind = SUPER+Shift,4,tag,4,0
bind = SUPER+Shift,5,tag,5,0
bind = SUPER+Shift,6,tag,6,0
bind = SUPER+Shift,7,tag,7,0
bind = SUPER+Shift,8,tag,8,0
bind = SUPER+Shift,9,tag,9,0
bind = SUPER+Shift,0,tag,10,0

# Screenshots
bind = SUPER,s,spawn_shell,pgrep -x slurp >/dev/null && exit 0; GEOM=$(slurp); [ -n "$GEOM" ] && grim -g "$GEOM" - | tee "$HOME/Pictures/Screenshot_$(date +'%Y-%m-%d_%H-%M-%S').png" | wl-copy -t image/png
bind = SUPER+Shift,s,spawn_shell,pgrep -x slurp >/dev/null && exit 0; GEOM=$(slurp); [ -n "$GEOM" ] && grim -g "$GEOM" - | tesseract stdin stdout -l eng 2>/dev/null | wl-copy && notify-send 'OCR Complete' 'Text copied to clipboard.'

# Volume Control
bind = NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind = NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Media Playback
bind = NONE,XF86AudioPlay,spawn,playerctl play-pause
bind = NONE,XF86AudioNext,spawn,playerctl next
bind = NONE,XF86AudioPrev,spawn,playerctl previous
bind = NONE,XF86AudioStop,spawn,playerctl stop

# Brightness Control
bind = NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bind = NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# Trackpad gestures
gesturebind=none,right,3,viewtoleft_have_client
gesturebind=none,left,3,viewtoright_have_client
gesturebind=none,up,3,toggleoverview
gesturebind=none,down,3,toggleoverview

# Mouse control
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
